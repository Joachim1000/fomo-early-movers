
name: 01 | Market Data & Spike Radars

on:
  workflow_dispatch:
  schedule:
    # Existing fallback schedules; local Warsaw trading-window guard controls execution.
    - cron: "5 6,7 * * *"
    - cron: "30 21,22 * * *"

permissions:
  contents: write

concurrency:
  group: fomo-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout market data branch
        uses: actions/checkout@v4
        with:
          ref: market-data
          persist-credentials: true

      - name: Check collection hours (Europe/Warsaw)
        id: collection_window
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git show origin/main:config/collection_hours.json > /tmp/fomo-collection-hours.json
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          config=json.load(open('/tmp/fomo-collection-hours.json'))
          blocked=config.get('blocked_hours',[])
          if not isinstance(blocked,list) or any(type(h) is not int or h<0 or h>23 for h in blocked):
              raise ValueError('Invalid blocked_hours: expected integers 0..23')
          if config.get('timezone')!='Europe/Warsaw':
              raise ValueError('Only Europe/Warsaw timezone is supported')
          now=datetime.now(ZoneInfo('Europe/Warsaw'))
          def minute_of_day(value):
              hh, mm = map(int, value.split(':'))
              if not (0 <= hh <= 23 and 0 <= mm <= 59):
                  raise ValueError('Invalid interval time')
              return hh * 60 + mm
          minute=now.hour*60+now.minute
          intervals=config.get('blocked_intervals',[])
          if not isinstance(intervals,list):
              raise ValueError('Invalid blocked_intervals')
          def in_interval(item):
              start=minute_of_day(item['start'])
              end=minute_of_day(item['end'])
              return (start <= minute < end) if start < end else (minute >= start or minute < end) if start > end else True
          enabled=now.hour not in blocked and not any(in_interval(item) for item in intervals)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"enabled={'true' if enabled else 'false'}\\n".replace('\\n','\n'))
          print(f"Collection {'ENABLED' if enabled else 'PAUSED'} at {now.isoformat()} (blocked_hours={blocked})")
          PY

      - name: Use current collection scripts from main
        if: steps.collection_window.outputs.enabled == 'true'
        run: |
          git fetch --depth=1 origin main
          for script in collect.py track_spike_radar_v2.py track_spike_radar.py track_beta_live_daily.py lock_daily.py prune_history.py track_candidate_outcomes.py; do
            git show "origin/main:scripts/$script" > "scripts/$script"
          done
          # Keep code updates local to this run; only JSON is committed.

      - name: Collect market data
        if: steps.collection_window.outputs.enabled == 'true'
        env:
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
        run: python scripts/collect.py


      - name: Record TOP 10 screening observations
        if: steps.collection_window.outputs.enabled == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          latest=json.loads(Path("data/latest.json").read_text())
          history=json.loads(Path("data/history.json").read_text())
          p=Path("data/recommendations.json")
          saved=json.loads(p.read_text())
          rows=saved["records"]
          stamp=latest.get("generated_at_utc")
          if not stamp:
              raise ValueError("Missing snapshot timestamp")
          snapshot=datetime.fromisoformat(stamp.replace("Z","+00:00"))
          if snapshot.tzinfo is None or (datetime.now(timezone.utc)-snapshot).total_seconds()>7200:
              raise ValueError("Snapshot missing timezone or older than 2 hours")
          history_stamps=[z.get("timestamp") for values in history.values() if isinstance(values,list) for z in values if isinstance(z,dict) and z.get("timestamp")]
          if not history_stamps or max(datetime.fromisoformat(t.replace("Z","+00:00")) for t in history_stamps)<snapshot:
              raise ValueError("History not caught up with latest snapshot")
          seen={(x.get("mint"),x.get("pair_address"),x.get("observed_at_utc")) for x in rows}
          added=0
          for rank,x in enumerate([c for c in latest.get("eligible_4h_candidates",[]) if c.get("mint")!="So11111111111111111111111111111111111111112"][:10],1):
              mint=x.get("mint")
              pair=x.get("pair_address")
              price=x.get("price_usd")
              if not mint or not pair or price is None or float(price)<=0:
                  continue
              key=(mint,pair,stamp)
              if key in seen:
                  continue
              buys=int(x.get("buy_transactions_5m") or 0)
              sells=int(x.get("sell_transactions_5m") or 0)
              if buys<0 or sells<0:
                  raise ValueError("Negative transaction count")
              status=("UNVERIFIED" if buys+sells==0 else "POSITIVE" if buys>=1.25*sells else "NEGATIVE" if sells>=1.25*buys else "WAIT")
              color={"POSITIVE":"green","NEGATIVE":"red","WAIT":"yellow","UNVERIFIED":"gray"}[status]
              rows.append({"mint":mint,"symbol":x.get("symbol") or mint[:8],"pair_address":pair,"observed_at_utc":stamp,"observation_price_usd":float(price),"displayed_status":status,"status_color":color,"call_type":"screening_status_not_buy_recommendation","rank":rank})
              seen.add(key)
              added+=1
          if added:
              p.write_text(json.dumps(saved,indent=2,ensure_ascii=False)+"\n")
          print(f"New observations: {added}; total: {len(rows)}")
          PY
      - name: Track production Spike Radar and verified outcomes
        if: steps.collection_window.outputs.enabled == 'true'
        run: python scripts/track_spike_radar.py

      - name: Track Spike Radar V2 signals and verified outcomes
        if: steps.collection_window.outputs.enabled == 'true'
        run: python scripts/track_spike_radar_v2.py

      - name: Track first discoveries and verified 5/10/15-minute outcomes
        if: steps.collection_window.outputs.enabled == 'true'
        run: python scripts/track_candidate_outcomes.py

      - name: Track beta live TOP 10 and lock daily performance
        if: steps.collection_window.outputs.enabled == 'true'
        run: python scripts/track_beta_live_daily.py

      - name: Lock daily 23:30 Poland snapshot (once per day)
        if: steps.collection_window.outputs.enabled == 'true'
        run: python scripts/lock_daily.py

      - name: Prune dashboard history older than 7 days
        if: steps.collection_window.outputs.enabled == 'true'
        run: python scripts/prune_history.py

      - name: Commit JSON
        if: steps.collection_window.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Scripts were loaded from main for execution; never commit them to the data branch.
          git restore -- scripts/collect.py scripts/track_beta_live_daily.py scripts/lock_daily.py
          rm -f scripts/track_spike_radar.py scripts/track_spike_radar_v2.py scripts/track_live_v31.py scripts/prune_history.py scripts/track_candidate_outcomes.py

          # Spike Radar publishing must not depend on LIVE V3.1 readiness.
          # The independent LIVE workflow owns its data and validation.
          git add data/spike_radar_history.json data/candidate_outcomes.json data/latest.json data/history.json data/recommendations.json data/spike_radar_v2_history.json data/beta_live_daily.json
          if [ -f data/early_spike_history.json ]; then git add data/early_spike_history.json; fi
          if [ -f data/fomo_cache.json ]; then git add data/fomo_cache.json; fi
          if [ -f data/daily_snapshots.json ]; then git add data/daily_snapshots.json; fi

          if ! git diff --cached --quiet; then
            git commit -m "Update market snapshot"
            # Retry non-fast-forward pushes without overwriting concurrent signal history.
            # A retry merges append-only signal records by mint + pair + alert timestamp,
            # and keeps the newest market snapshot when another collector won the race.
            for attempt in 1 2 3; do
              if git push origin HEAD:market-data; then
                echo "Market snapshot pushed successfully (attempt $attempt)."
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Could not safely reconcile concurrent market-data updates after 3 attempts."
                exit 1
              fi
              echo "Concurrent update detected; fetching latest market-data and reconciling JSON (attempt $attempt)."
              git fetch origin market-data
              # Save this job's committed data before updating to the remote tip.
              mkdir -p /tmp/fomo-retry-local
              cp data/*.json /tmp/fomo-retry-local/
              git reset --hard origin/market-data
              python3 - <<'PY'
          import json
          from pathlib import Path
          local = Path('/tmp/fomo-retry-local')
          remote = Path('data')
          signal_files = ('spike_radar_history.json', 'spike_radar_v2_history.json',
                          'candidate_outcomes.json', 'recommendations.json')
          def stamp(row):
              return str(row.get('first_alert_at_utc') or row.get('observed_at_utc')
                         or row.get('first_qualified_at_utc') or '')
          def identity(row):
              return (str(row.get('mint') or ''), str(row.get('pair_address') or ''),
                      stamp(row))
          def updated(row):
              return sum(row.get(k) is not None for k in
                         ('return_5m_pct','return_10m_pct','price_5m_usd','price_10m_usd'))
          def load(path):
              try: return json.loads(path.read_text())
              except (FileNotFoundError, ValueError): return None
          for name in signal_files:
              incoming, existing = load(local/name), load(remote/name)
              if not isinstance(incoming,dict) or not isinstance(incoming.get('records'),list):
                  continue
              if not isinstance(existing,dict) or not isinstance(existing.get('records'),list):
                  existing={'records':[]}
              combined={}
              for row in existing['records']+incoming['records']:
                  if not isinstance(row,dict): continue
                  key=identity(row)
                  if key not in combined:
                      combined[key]=row.copy()
                  else:
                      previous=combined[key]
                      # Preserve verified observations and enrich records, never replace with pending.
                      for field,value in row.items():
                          if value is not None and (previous.get(field) is None or
                              (field in ('status','status_10m') and updated(row)>updated(previous))):
                              previous[field]=value
              existing['records']=sorted(combined.values(),key=stamp)
              if name in ('spike_radar_history.json','spike_radar_v2_history.json'):
                  active=dict(existing.get('active_alerts') or {})
                  active.update(incoming.get('active_alerts') or {})
                  existing['active_alerts']=active
              (remote/name).write_text(json.dumps(existing,indent=2,ensure_ascii=False)+'\n')
          # Market snapshots are not merged: only publish this job's snapshot when newer.
          def snapshot_time(data):
              return str(data.get('generated_at_utc') or '') if isinstance(data,dict) else ''
          incoming=load(local/'latest.json')
          existing=load(remote/'latest.json')
          if snapshot_time(incoming)>snapshot_time(existing):
              for name in ('latest.json','history.json','fomo_cache.json','live_v31.json',
                           'beta_live_daily.json','daily_snapshots.json'):
                  source=local/name
                  if source.exists(): (remote/name).write_bytes(source.read_bytes())
          PY
              git add data/*.json
              if git diff --cached --quiet; then
                echo "Remote already contains equivalent or newer data."
                break
              fi
              git commit -m "Reconcile concurrent market snapshots and preserve signal history"
            done
          fi
