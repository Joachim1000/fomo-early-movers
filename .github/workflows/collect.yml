
name: Fomo Early Movers Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fomo-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout market data branch
        uses: actions/checkout@v4
        with:
          ref: market-data
          persist-credentials: true

      - name: Use current collection scripts from main
        run: |
          git fetch --depth=1 origin main
          for script in collect.py track_early_spikes.py track_beta_spikes.py track_beta_live_daily.py lock_daily.py; do
            git show "origin/main:scripts/$script" > "scripts/$script"
          done
          # Keep code updates local to this run; only JSON is committed.

      - name: Collect market data
        env:
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
        run: python scripts/collect.py


      - name: Record TOP 10 screening observations
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          latest=json.loads(Path("data/latest.json").read_text())
          history=json.loads(Path("data/history.json").read_text())
          p=Path("data/recommendations.json")
          saved=json.loads(p.read_text())
          rows=saved["records"]
          stamp=latest.get("generated_at_utc")
          if not stamp:
              raise ValueError("Missing snapshot timestamp")
          snapshot=datetime.fromisoformat(stamp.replace("Z","+00:00"))
          if snapshot.tzinfo is None or (datetime.now(timezone.utc)-snapshot).total_seconds()>7200:
              raise ValueError("Snapshot missing timezone or older than 2 hours")
          history_stamps=[z.get("timestamp") for values in history.values() if isinstance(values,list) for z in values if isinstance(z,dict) and z.get("timestamp")]
          if not history_stamps or max(datetime.fromisoformat(t.replace("Z","+00:00")) for t in history_stamps)<snapshot:
              raise ValueError("History not caught up with latest snapshot")
          seen={(x.get("mint"),x.get("pair_address"),x.get("observed_at_utc")) for x in rows}
          added=0
          for rank,x in enumerate([c for c in latest.get("eligible_4h_candidates",[]) if c.get("mint")!="So11111111111111111111111111111111111111112"][:10],1):
              mint=x.get("mint")
              pair=x.get("pair_address")
              price=x.get("price_usd")
              if not mint or not pair or price is None or float(price)<=0:
                  continue
              key=(mint,pair,stamp)
              if key in seen:
                  continue
              buys=int(x.get("buy_transactions_5m") or 0)
              sells=int(x.get("sell_transactions_5m") or 0)
              if buys<0 or sells<0:
                  raise ValueError("Negative transaction count")
              status=("UNVERIFIED" if buys+sells==0 else "POSITIVE" if buys>=1.25*sells else "NEGATIVE" if sells>=1.25*buys else "WAIT")
              color={"POSITIVE":"green","NEGATIVE":"red","WAIT":"yellow","UNVERIFIED":"gray"}[status]
              rows.append({"mint":mint,"symbol":x.get("symbol") or mint[:8],"pair_address":pair,"observed_at_utc":stamp,"observation_price_usd":float(price),"displayed_status":status,"status_color":color,"call_type":"screening_status_not_buy_recommendation","rank":rank})
              seen.add(key)
              added+=1
          if added:
              p.write_text(json.dumps(saved,indent=2,ensure_ascii=False)+"\n")
          print(f"New observations: {added}; total: {len(rows)}")
          PY
      - name: Track early spikes and 15-minute outcomes
        run: python scripts/track_early_spikes.py

      - name: Track experimental beta spikes and five-minute outcomes
        run: python scripts/track_beta_spikes.py

      - name: Track beta live TOP 10 and lock daily performance
        run: python scripts/track_beta_live_daily.py

      - name: Lock daily 23:30 Poland snapshot (once per day)
        run: python scripts/lock_daily.py

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json data/history.json data/recommendations.json data/early_spike_history.json data/beta_spike_history.json data/beta_live_daily.json
          if [ -f data/daily_snapshots.json ]; then git add data/daily_snapshots.json; fi

          if ! git diff --cached --quiet; then
            git commit -m "Update market snapshot"
            # A concurrent dashboard edit or collection may have advanced market-data.
            # Replay this snapshot commit on the latest market-data before pushing.
            # Never force-push or silently overwrite conflicting JSON.
            for attempt in 1 2 3 4 5; do
              git fetch origin market-data
              if ! git rebase origin/market-data; then
                git rebase --abort || true
                echo "::error::Snapshot conflicts with newer remote data. Refusing to overwrite."
                exit 1
              fi
              if git push origin HEAD:market-data; then
                echo "Market snapshot pushed successfully (attempt $attempt)."
                exit 0
              fi
              echo "Remote advanced during push; retrying ($attempt/5)..."
              sleep $((attempt * 2))
            done
            echo "::error::Could not push after 5 attempts."
            exit 1
          fi
