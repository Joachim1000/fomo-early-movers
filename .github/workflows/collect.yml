
name: Fomo Early Movers Data

on:
  workflow_dispatch:
  schedule:
    # UTC pairs cover Warsaw summer/winter time; portfolio script enforces local time.
    - cron: "5 6,7 * * *"
    - cron: "30 21,22 * * *"

permissions:
  contents: write

concurrency:
  group: fomo-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout market data branch
        uses: actions/checkout@v4
        with:
          ref: market-data
          persist-credentials: true

      - name: Check collection hours (Europe/Warsaw)
        id: collection_window
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git show origin/main:config/collection_hours.json > /tmp/fomo-collection-hours.json
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          config=json.load(open('/tmp/fomo-collection-hours.json'))
          blocked=config.get('blocked_hours',[])
          if not isinstance(blocked,list) or any(type(h) is not int or h<0 or h>23 for h in blocked):
              raise ValueError('Invalid blocked_hours: expected integers 0..23')
          if config.get('timezone')!='Europe/Warsaw':
              raise ValueError('Only Europe/Warsaw timezone is supported')
          now=datetime.now(ZoneInfo('Europe/Warsaw'))
          enabled=now.hour not in blocked
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"enabled={'true' if enabled else 'false'}\\n".replace('\\n','\n'))
          print(f"Collection {'ENABLED' if enabled else 'PAUSED'} at {now.isoformat()} (blocked_hours={blocked})")
          PY

      - name: Use current collection scripts from main
        if: steps.collection_window.outputs.enabled == 'true'
        run: |
          git fetch --depth=1 origin main
          for script in collect.py track_beta_spikes.py track_spike_radar.py track_beta_live_daily.py track_live_v31.py lock_daily.py prune_history.py track_candidate_outcomes.py; do
            git show "origin/main:scripts/$script" > "scripts/$script"
          done
          # Keep code updates local to this run; only JSON is committed.

      - name: Collect market data
        if: steps.collection_window.outputs.enabled == 'true'
        env:
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
        run: python scripts/collect.py


      - name: Record TOP 10 screening observations
        if: steps.collection_window.outputs.enabled == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          latest=json.loads(Path("data/latest.json").read_text())
          history=json.loads(Path("data/history.json").read_text())
          p=Path("data/recommendations.json")
          saved=json.loads(p.read_text())
          rows=saved["records"]
          stamp=latest.get("generated_at_utc")
          if not stamp:
              raise ValueError("Missing snapshot timestamp")
          snapshot=datetime.fromisoformat(stamp.replace("Z","+00:00"))
          if snapshot.tzinfo is None or (datetime.now(timezone.utc)-snapshot).total_seconds()>7200:
              raise ValueError("Snapshot missing timezone or older than 2 hours")
          history_stamps=[z.get("timestamp") for values in history.values() if isinstance(values,list) for z in values if isinstance(z,dict) and z.get("timestamp")]
          if not history_stamps or max(datetime.fromisoformat(t.replace("Z","+00:00")) for t in history_stamps)<snapshot:
              raise ValueError("History not caught up with latest snapshot")
          seen={(x.get("mint"),x.get("pair_address"),x.get("observed_at_utc")) for x in rows}
          added=0
          for rank,x in enumerate([c for c in latest.get("eligible_4h_candidates",[]) if c.get("mint")!="So11111111111111111111111111111111111111112"][:10],1):
              mint=x.get("mint")
              pair=x.get("pair_address")
              price=x.get("price_usd")
              if not mint or not pair or price is None or float(price)<=0:
                  continue
              key=(mint,pair,stamp)
              if key in seen:
                  continue
              buys=int(x.get("buy_transactions_5m") or 0)
              sells=int(x.get("sell_transactions_5m") or 0)
              if buys<0 or sells<0:
                  raise ValueError("Negative transaction count")
              status=("UNVERIFIED" if buys+sells==0 else "POSITIVE" if buys>=1.25*sells else "NEGATIVE" if sells>=1.25*buys else "WAIT")
              color={"POSITIVE":"green","NEGATIVE":"red","WAIT":"yellow","UNVERIFIED":"gray"}[status]
              rows.append({"mint":mint,"symbol":x.get("symbol") or mint[:8],"pair_address":pair,"observed_at_utc":stamp,"observation_price_usd":float(price),"displayed_status":status,"status_color":color,"call_type":"screening_status_not_buy_recommendation","rank":rank})
              seen.add(key)
              added+=1
          if added:
              p.write_text(json.dumps(saved,indent=2,ensure_ascii=False)+"\n")
          print(f"New observations: {added}; total: {len(rows)}")
          PY
      - name: Track production Spike Radar and verified outcomes
        if: steps.collection_window.outputs.enabled == 'true'
        run: python scripts/track_spike_radar.py

      - name: Track experimental beta spikes and five-minute outcomes
        if: steps.collection_window.outputs.enabled == 'true'
        run: python scripts/track_beta_spikes.py

      - name: Track first discoveries and verified 5/10/15-minute outcomes
        if: steps.collection_window.outputs.enabled == 'true'
        run: python scripts/track_candidate_outcomes.py

      - name: Track beta live TOP 10 and lock daily performance
        if: steps.collection_window.outputs.enabled == 'true'
        run: python scripts/track_beta_live_daily.py

      - name: Generate independent LIVE V3.1 ranking
        if: steps.collection_window.outputs.enabled == 'true'
        run: python scripts/track_live_v31.py

      - name: Lock daily 23:30 Poland snapshot (once per day)
        if: steps.collection_window.outputs.enabled == 'true'
        run: python scripts/lock_daily.py

      - name: Prune dashboard history older than 7 days
        if: steps.collection_window.outputs.enabled == 'true'
        run: python scripts/prune_history.py

      - name: Commit JSON
        if: steps.collection_window.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Scripts were loaded from main for execution; never commit them to the data branch.
          git restore -- scripts/collect.py scripts/track_beta_spikes.py scripts/track_beta_live_daily.py scripts/lock_daily.py
          rm -f scripts/track_spike_radar.py scripts/track_live_v31.py scripts/prune_history.py scripts/track_candidate_outcomes.py

          git add data/spike_radar_history.json data/candidate_outcomes.json data/latest.json data/history.json data/recommendations.json data/beta_spike_history.json data/beta_live_daily.json data/live_v31.json
          if [ -f data/early_spike_history.json ]; then git add data/early_spike_history.json; fi
          if [ -f data/fomo_cache.json ]; then git add data/fomo_cache.json; fi
          if [ -f data/daily_snapshots.json ]; then git add data/daily_snapshots.json; fi

          if ! git diff --cached --quiet; then
            git commit -m "Update market snapshot"
            # The market-data branch is written by collectors and occasional manual resets.
            # Preserve a manual reset of beta history instead of rebasing stale JSON over it.
            if git push origin HEAD:market-data; then
              echo "Market snapshot pushed successfully."
            else
              echo "::error::Concurrent market-data update detected. Stale snapshot not pushed; next scheduled run will recollect."
              exit 1
            fi
          fi
