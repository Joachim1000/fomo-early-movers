
name: Fomo Early Movers Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fomo-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test FOMO API
        continue-on-error: true
        env:
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.environ.get("FOMO_API_KEY", "")
          if not key:
              raise SystemExit("FOMO_API_KEY is missing")

          url = (
              "https://api.fomoapi.io/v2/leaderboard/"
              "tokens/trending?limit=15"
          )

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + key,
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)

              print("FOMO API connection successful")
              print("Response type:", type(data).__name__)

              if isinstance(data, list):
                  print("Items returned:", len(data))
              elif isinstance(data, dict):
                  print("Response fields:", list(data.keys()))

          except urllib.error.HTTPError as e:
              print("FOMO API HTTP status:", e.code)
              raise
          PY

      - name: Collect market data
        env:
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
        run: python scripts/collect.py

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json data/history.json

          if ! git diff --cached --quiet; then
            git commit -m "Update market snapshot"
            git push
          fi
