name: Record FOMO TOP 10 screenings
on:
  push:
    branches: [main]
    paths:
      - 'data/latest.json'
      - 'data/history.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fomo-screening-history
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Append new observed TOP 10 only
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          latest=json.loads(Path("data/latest.json").read_text())
          history=json.loads(Path("data/history.json").read_text())
          p=Path("data/recommendations.json")
          saved=json.loads(p.read_text())
          rows=saved["records"]
          stamp=latest.get("generated_at_utc")
          if not stamp:
              raise ValueError("Missing snapshot timestamp")
          snapshot=datetime.fromisoformat(stamp.replace("Z","+00:00"))
          if snapshot.tzinfo is None or (datetime.now(timezone.utc)-snapshot).total_seconds()>7200:
              raise ValueError("Snapshot missing timezone or older than 2 hours")
          history_stamps=[z.get("timestamp") for values in history.values() if isinstance(values,list) for z in values if isinstance(z,dict) and z.get("timestamp")]
          if not history_stamps or max(datetime.fromisoformat(t.replace("Z","+00:00")) for t in history_stamps)<snapshot:
              raise ValueError("History not caught up with latest snapshot")
          seen={(x.get("mint"),x.get("pair_address"),x.get("observed_at_utc")) for x in rows}
          added=0
          for rank,x in enumerate([c for c in latest.get("eligible_4h_candidates",[]) if c.get("mint")!="So11111111111111111111111111111111111111112"][:10],1):
              mint=x.get("mint")
              pair=x.get("pair_address")
              price=x.get("price_usd")
              if not mint or not pair or price is None or float(price)<=0:
                  continue
              key=(mint,pair,stamp)
              if key in seen:
                  continue
              buys=int(x.get("buy_transactions_5m") or 0)
              sells=int(x.get("sell_transactions_5m") or 0)
              if buys<0 or sells<0:
                  raise ValueError("Negative transaction count")
              status=("UNVERIFIED" if buys+sells==0 else "POSITIVE" if buys>=1.25*sells else "NEGATIVE" if sells>=1.25*buys else "WAIT")
              color={"POSITIVE":"green","NEGATIVE":"red","WAIT":"yellow","UNVERIFIED":"gray"}[status]
              rows.append({"mint":mint,"symbol":x.get("symbol") or mint[:8],"pair_address":pair,"observed_at_utc":stamp,"observation_price_usd":float(price),"displayed_status":status,"status_color":color,"call_type":"screening_status_not_buy_recommendation","rank":rank})
              seen.add(key)
              added+=1
          if added:
              p.write_text(json.dumps(saved,indent=2,ensure_ascii=False)+"\n")
          print(f"New observations: {added}; total: {len(rows)}")
          PY
      - name: Commit only if records changed
        shell: bash
        run: |
          if git diff --quiet -- data/recommendations.json; then
            echo "No new observations; no commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recommendations.json
          git commit -m "Record fresh TOP 10 screening observations"
          git push
